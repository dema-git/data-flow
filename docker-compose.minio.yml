services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_API_PORT_EXTERNAL}:9010"
      - "${MINIO_CONSOLE_PORT_EXTERNAL}:9011"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --address ":9010" --console-address ":9011"
    volumes:
      - ./minio-data:/data
      - ./shared_logs:/shared/logs
    restart: always
    networks:
      - project_default

  minio-init:
    build:
      context: .
      dockerfile: ./services/minio-init/Dockerfile
    environment:
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    networks:
      - project_default
    restart: "no"


networks:
  project_default:
    name: dataflow_network