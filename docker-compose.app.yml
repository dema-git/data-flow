services:
  api_app:
    build:
      context: .
      dockerfile: services/fastapi_app/Dockerfile
    container_name: api_app
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shared_logs:/shared/logs
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
